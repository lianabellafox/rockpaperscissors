<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/scissors.ico" type="image/x-icon">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
<div class="intro">
    <p class="introduction">Welcome to Rock, Paper, Scissors!</p>
    <p class="instructions">⚠️ You are now battling against the computer, make your choice now! ⚠️</p>
</div>
<div class="rockpaperscissors">
    <button class="rock" onClick="
        const randomNumber = Math.random();
        if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'Rock';
         } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'Paper';
         } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'Scissors';
         }
         console.log(computerMove);

         if (computerMove === 'Rock') {
        result = 'You tied!';
        tieWins++;
         } else if (computerMove === 'Paper') {
        result = 'You lose!';
        computerWins+
         } else if (computerMove === 'Scissors') {
        result = 'You win!';
        userWins++;
        }

        document.getElementById('tieScore').textContent = tieWins;
        document.getElementById('userScore').textContent = userWins;
        document.getElementById('computerScore').textContent = computerWins;
        alert(`You picked Rock. Computer picked ${computerMove}. ${result}`);

    "><img src="images/rock.png" alt="Rock"></button>

    <button class="paper" onClick="
        const randomNumber = Math.random();
        if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'Rock';
         } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'Paper';
         } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'Scissors';
         }
         console.log(computerMove);

         if (computerMove === 'Paper') {
        result = 'You tied!';
        tieWins++;
         } else if (computerMove === 'Scissors') {
        result = 'You lose!';
        computerWins++;
         } else if (computerMove === 'Rock') {
        result = 'You win!';
        userWins++;
         }
        
        document.getElementById('tieScore').textContent = tieWins;
        document.getElementById('userScore').textContent = userWins;
        document.getElementById('computerScore').textContent = computerWins;
        alert(`You picked Paper. Computer picked ${computerMove}. ${result}`);
    
    
    
    "><img src="images/paper.png" alt="Paper"></button>
    <button class="scissors" onClick="
        const randomNumber = Math.random();
        if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'Rock';
         } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'Paper';
         } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'Scissors';
         }
         console.log(computerMove);
         if (computerMove === 'Scissors') {
        result = 'You tied!';
        tieWins++;
         } else if (computerMove === 'Rock') {
        result = 'You lose!';
        computerWins++;
         } else if (computerMove === 'Paper') {
        result = 'You win!';
        userWins++;
         }
        
        document.getElementById('tieScore').textContent = tieWins;
        document.getElementById('userScore').textContent = userWins;
        document.getElementById('computerScore').textContent = computerWins;
        alert(`You picked Scissors. Computer picked ${computerMove}. ${result}`);
    
    "><img src="images/scissors.png" alt="Scissors"></button>
</div>


<p class="userwins">User wins: <span id="userScore">0</span></p>
<p class="computerwins">Computer wins: <span id="computerScore">0</span></p>
<p class="tiewins">Ties: <span id="tieScore">0</span></p>

<hr>
</body>

<script>
    let userWins = 0;
    let computerWins = 0;
    let tieWins = 0;
    const randomNumber = Math.random();
    let computerMove = '';
    let result = '';
</script>

<footer>
    This ultra basic game was brought to you by Liana Rees<br>on January 15, 2026.
</footer>
</body>
</html>
